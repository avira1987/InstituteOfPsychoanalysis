name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anistito
          POSTGRES_PASSWORD: anistito
          POSTGRES_DB: anistito
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anistito"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://anistito:anistito@localhost:5432/anistito
      DATABASE_URL_SYNC: postgresql://anistito:anistito@localhost:5432/anistito
      DEBUG: "true"
      SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run payment callback tests
        run: pytest tests/test_payment_routes_callback.py tests/test_payment_callback_session_payment.py -q
      - name: Run core tests
        run: pytest tests/core/test_engine.py tests/services/test_sla_monitor.py tests/test_login_panel.py -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E smoke (home page)
        run: npx playwright test e2e/home-page-renders.spec.ts --project=chromium
        continue-on-error: true
